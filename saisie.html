
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>

    <h2>Exercice 4.3</h2>
<h3>Saisie des notes de l'apprenant</h3>

<form action="traitement.php" method="POST">

    <label for="nom">Nom :</label>
    <input type="text" id="nom" name="nom" required>
    <br><br>

    <label for="note_info">Note en informatique :</label>
    <input type="number" id="note_info" name="note_info"
           min="0" max="20" step="any" required>
    <br><br>

    <label for="note_math">Note en mathématiques :</label>
    <input type="number" id="note_math" name="note_math"
           min="0" max="20" step="any" required>
    <br><br>

    <button type="submit">Envoyer</button>

</form>

</body>
</html>
